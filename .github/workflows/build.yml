name: Build EzFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract & Build APK
        run: |
          mkdir -p project_source
          unzip -o EzFlow-Android-Project.zip -d project_source
          
          # پیدا کردن مسیر ریشه پروژه که settings.gradle یا build.gradle دارد
          PROJECT_DIR=$(find project_source -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
          
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # استفاده از نسخه پایدار Gradle 8.7 به جای نسخه 9
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EzFlow-Debug-APK
          path: project_source/**/build/outputs/apk/**/*.apk
