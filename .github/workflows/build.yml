name: Build EzFlow APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Android Project
        run: |
          unzip -q EzFlow-Android-Project.zip -d source_dir

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Wrapper and Build APK
        run: |
          cd source_dir/EzFlow-Android-Project
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EzFlow-APK
          path: source_dir/EzFlow-Android-Project/app/build/outputs/apk/debug/app-debug.apk
