name: Build EzFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Extract & Diagnose & Build APK
        run: |
          mkdir -p project_source
          unzip -o EzFlow-Android-Project.zip -d project_source
          
          cd project_source/EzFlow-Android-Project
          
          echo "=== ROOT build.gradle ==="
          cat build.gradle || true
          
          echo "=== APP build.gradle ==="
          cat app/build.gradle || true

          # قبول لایسنس‌های اندروید
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # اجرای بیلد و ذخیره لاگ تمیز
          gradle assembleDebug --no-daemon --info > build_output.log 2>&1 || BUILD_FAILED=true

          if [ "$BUILD_FAILED" = true ]; then
            echo "====================== ERROR LOGS ======================"
            grep -E -C 3 "error:|FAILURE:|FAILED|What went wrong:|compileDebugJavaWithJavac" build_output.log | tail -n 50
            echo "========================================================"
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EzFlow-Debug-APK
          path: project_source/EzFlow-Android-Project/app/build/outputs/apk/debug/*.apk
