name: Build EzFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract & Build APK
        run: |
          mkdir -p project_source
          unzip -o EzFlow-Android-Project.zip -d project_source
          
          # پیدا کردن خودکار مسیر اصلی پروژه (هر جا که build.gradle هست)
          PROJECT_DIR=$(find project_source -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: build.gradle not found in zip!"
            exit 1
          fi
          
          cd "$PROJECT_DIR"
          
          # اگر فایل gradlew وجود نداشت، آن را بساز
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EzFlow-Debug-APK
          path: project_source/**/build/outputs/apk/debug/*.apk
