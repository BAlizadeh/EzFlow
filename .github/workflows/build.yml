name: Build EzFlow APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip Android project
        run: |
          unzip -q EzFlow-Android-Project.zip -d source
          test -f source/EzFlow-Android-Project/app/build.gradle

      - name: Build debug APK
        working-directory: source/EzFlow-Android-Project
        run: gradle assembleDebug

      - name: Save APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: EzFlow-debug-APK
          path: source/EzFlow-Android-Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
