name: Build EzFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Extract, Fix Kotlin Conflicts & Build APK
        run: |
          mkdir -p project_source
          unzip -o EzFlow-Android-Project.zip -d project_source
          
          cd project_source/EzFlow-Android-Project
          
          # افزودن قانون حل تعارض نسخه‌های کاتلین به انتهای app/build.gradle
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

          # قبول لایسنس‌های اندروید
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # ساخت APK
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EzFlow-Debug-APK
          path: project_source/EzFlow-Android-Project/app/build/outputs/apk/debug/*.apk
